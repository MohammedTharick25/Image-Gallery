<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Image Gallery</h1>
      <img
        src="images/one.jpg"
        alt="random image"
        class="main-image"
        width="400px"
        height="400px"
      />
      <div class="btns">
        <button id="previous">Previous</button>
        <button id="next">Next</button>
      </div>
      <div>
        <img
          src="images/one.jpg"
          alt="one"
          class="thumb active"
          width="100px"
          height="100px"
        />
        <img
          src="images/two.jpg"
          alt="one"
          class="thumb"
          width="100px"
          height="100px"
        />
        <img
          src="images/three.jpg"
          alt="one"
          class="thumb"
          width="100px"
          height="100px"
        />
        <img
          src="images/four.jpg"
          alt="one"
          class="thumb"
          width="100px"
          height="100px"
        />
        <img
          src="images/five.jpg"
          alt="one"
          class="thumb"
          width="100px"
          height="100px"
        />
      </div>
      <footer><h3>Made by Tharick.</h3></footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
